<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vita Travel</title>
    <link rel="canonical" href="html/index.html" />
    <!-- Fallback for when JavaScript is disabled. -->
    <meta http-equiv="refresh" content="0; url=html/index.html" />
    <script>
      // The meta refresh above cannot carry a URL fragment, and this site's own
      // navigation uses anchors such as "#retreats". Replacing the location keeps
      // the fragment; the meta tag stays as the no-JavaScript fallback.
      location.replace("html/index.html" + location.hash);
    </script>
  </head>
  <body>
    <p>The homepage lives at <a href="html/index.html">html/index.html</a>.</p>
  </body>
</html>
